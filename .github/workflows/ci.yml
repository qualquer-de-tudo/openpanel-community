name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo_sqlite, mbstring, intl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run translations:check
      - run: npm run build:package
      - run: npm run build:demo
      - run: composer test
      - name: Test restricted Linux maintenance broker
        run: docker run --rm -v "$PWD:/work:ro" -w /work python:3.13-slim python -m unittest discover -s tests/Agent -v
      - run: composer templates:check
      - name: Check published template versions
        env:
          TEMPLATE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node bin/templates-policy.mjs
      - run: node --test tests/Unit/*.test.mjs
      - name: Exercise the pinned CVE scanner on a public Ubuntu fixture
        run: |
          docker volume create openpanel-cve-fixture
          docker run --rm -v openpanel-cve-fixture:/out ubuntu:24.04 sh -c 'mkdir -p /out/etc /out/usr/lib /out/var/lib/dpkg; cp /etc/os-release /out/etc/os-release; cp /usr/lib/os-release /out/usr/lib/os-release; cp /etc/lsb-release /out/etc/lsb-release; cp /var/lib/dpkg/status /out/var/lib/dpkg/status'
          SCANNER=$(python3 -c 'import runpy; print(runpy.run_path("bin/host-agent.py")["SCANNER"])')
          docker run --rm --cap-drop=ALL --security-opt=no-new-privileges --read-only --memory=1g --cpus=1 --pids-limit=128 --tmpfs /tmp:rw,noexec,nosuid,size=512m -v openpanel-cve-fixture:/host:ro -v openpanel-trivy-test-cache:/cache "$SCANNER" rootfs --cache-dir /cache --scanners vuln --pkg-types os --offline-scan --list-all-pkgs=false --format json /host > /tmp/openpanel-scan.json
          python3 -c 'import json; value=json.load(open("/tmp/openpanel-scan.json")); assert value["Metadata"]["OS"]["Family"] == "ubuntu"; assert any(row.get("Class") == "os-pkgs" for row in value.get("Results", []))'
      - run: docker compose config --quiet
      - run: PANEL_DOMAIN=panel.example.com docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - run: for script in install.sh docker/install.sh docker/entrypoint.sh; do bash -n "$script"; done
      - run: docker compose build
      - name: Test module in a clean Laravel application
        run: |
          docker compose up -d --no-build
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/qopenpanel/login > /tmp/panel-login.html; then break; fi
            sleep 2
          done
          grep -q '/vendor/qopenpanel/assets/' /tmp/panel-login.html
          docker compose exec -T panel php artisan qopenpanel:install --force
          docker compose exec -T panel php artisan route:cache
          docker compose exec -T panel php artisan config:cache
          curl --fail --silent http://127.0.0.1:8080/qopenpanel/login > /tmp/panel-cached.html
          grep -q 'data-qopenpanel-path="/qopenpanel"' /tmp/panel-cached.html
          docker compose exec -T panel composer show qualquer-de-tudo/openpanel-community --path
  bootstrap:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:24.04", "debian:13-slim"]
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Docker prerequisites in a clean container
        run: |
          docker run --rm -v "$PWD/install.sh:/installer.sh:ro" "${{ matrix.image }}" bash -c 'source /installer.sh; op_install_packages; docker --version; docker compose version; docker buildx version'
