services:
  panel:
    environment:
      APP_URL: "https://${PANEL_DOMAIN:?Defina PANEL_DOMAIN no arquivo de deploy}"
      SESSION_SECURE_COOKIE: "true"
  web:
    environment:
      PANEL_HOST: "${PANEL_DOMAIN:?Defina PANEL_DOMAIN no arquivo de deploy}"
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
